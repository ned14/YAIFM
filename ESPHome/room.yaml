  - platform: hbridge
    id: ventilation_backwards
    name: "Ventilation fan backwards"
    pin_a: vent_backwards
    pin_b: vent_forwards

cover:
  - platform: template
    id: blind_cover
    name: "Blind"
    has_position: true
    open_action:
      - script.execute:
          id: do_position_blind
          pos: 0.0  # inverted, 0.0 is fully open
          speed: 1.0
    close_action:
      - script.execute:
          id: do_position_blind
          pos: 1.0  # inverted
          speed: 1.0
    stop_action:
      - script.execute:
          id: do_position_blind
          pos: 0.0
          speed: 0.0
    position_action:
      - script.execute:
          id: do_position_blind
          pos: !lambda 'return 1.0f - pos;'
          speed: 1.0

    
